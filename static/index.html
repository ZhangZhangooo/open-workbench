<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工作台</title>
<link rel="stylesheet" href="/static/style.css">

<!-- 装到主屏（PWA）。注意：装成真 App 需要 https 或 localhost 这种安全上下文，
     手机连 http://192.168.x.x:8777 明文地址时，安卓 Chrome 只会存个书签。
     想要全屏无地址栏，用设置页里那条 https 隧道地址打开再加主屏。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
</head>
<body>

<div class="shell">

  <div class="topstat" id="topstat">
    <button class="mburger" id="btnMenu" aria-label="打开菜单" title="菜单">
      <span></span><span></span><span></span>
    </button>
    <span class="led" title="在线"></span>
    <span class="brand">OPENCLAW <b>▸</b> WORKBENCH</span>
    <span class="ver">v2.0.0 · local</span>
    <span class="gap"></span>
    <span class="m">UPTIME <b id="mUptime">--:--:--</b></span>
    <span class="m">CPU <span class="mbar" id="mCpuBar"><i id="mCpu"></i></span></span>
    <span class="m">MEM <b id="mMem">--</b></span>
    <span class="m">DISK <b id="mDisk">--</b></span>
        <span class="m clk" id="mClock">--:--:--</span>
        <span class="m" id="cloudStat" style="display:none"></span>
        <span class="kicon" id="btnLang" title="界面语言" data-wb-lang="zh">ZH</span>
        <span class="kicon" id="btnCmd2" title="命令面板 (Ctrl/⌘ K)">⌘K</span>
  </div>

  <div class="body">
    <aside>
      <div class="side-lbl">Modules</div>
      <div id="mods"></div>
      <div class="console" id="console">
        <div class="ct">Console</div>
        <div id="consoleLines"></div>
      </div>
      <div class="side-foot">
        <button id="btnTheme">主题</button>
        <button id="btnCmd">命令</button>
        <button id="btnLang2" data-wb-lang="zh" title="界面语言">ZH</button>
      </div>
    </aside>

    <div class="rail">
      <div class="topbar">
        <div class="t" id="topTitle">今日</div>
        <div class="sp">
          <span id="topState"></span>
          <span class="kbd" id="dot"></span>
        </div>
      </div>
      <div id="stage"></div>
    </div>
  </div>

  <!-- 手机端：抽屉遮罩 + 底部 tab 条。桌面上这两个是 display:none，一点不影响 -->
  <div class="scrim" id="scrim"></div>
  <nav class="mobar" id="mobar"></nav>
</div>

<div class="cmdk" id="cmdk">
  <div class="cmdk-box">
    <input id="cmdInput" placeholder="输入命令、文件名，或者直接记点什么…" autocomplete="off">
    <div class="cmdk-list" id="cmdList"></div>
  </div>
</div>

<div class="cmdk" id="launch">
  <div class="cmdk-box">
    <input id="lcInput" placeholder="启动程序、打开文件…" autocomplete="off">
    <div class="cmdk-list" id="lcList"></div>
  </div>
</div>

<div id="toasts"></div>

<!-- 云同步：CDN SDK（经典脚本，先执行）+ cloud.js（设置 window.CloudSync），再加载 core.js -->
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="/static/cloud.js"></script>
<script type="module" src="/static/core.js"></script>
<!-- i18n：语言默认跟随系统（navigator.language），设置页可覆盖并存 localStorage。
     刻意放在 core.js 之后：i18n.apply() 会扫 DOM + 挂 MutationObserver，
     所以即便模块是异步渲染出来的，后续新增节点也会被翻译到。 -->
<script type="module">
  import i18n from '/static/i18n.js';
  window.WBi18n = i18n;
  try {
    await i18n.load();
    i18n.apply();
  } catch (e) {
    // 语言包加载失败绝不能影响主应用，直接退回中文
    console.warn('[i18n] 加载失败，继续用中文', e);
  }
</script>
</body>
</html>
